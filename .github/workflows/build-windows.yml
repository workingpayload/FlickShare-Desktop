name: Build Windows app

# Push to main  -> test, build, and publish release v<APP_VERSION> (flickshare_app/__init__.py).
#                  Pushing again with the same version replaces that release's files.
# Push a v* tag -> test, build, and publish that version (e.g. v1.2.0).
# Pull requests / manual runs -> test and build; the exe is attached to the run as an artifact.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}([-+][0-9A-Za-z.-]+)?$') { throw "Tag '$env:TAG' is not a version like v1.2.0" }
          $init = 'flickshare_app/__init__.py'
          (Get-Content $init) -replace '^APP_VERSION = ".*"$', "APP_VERSION = `"$version`"" | Set-Content $init -Encoding utf8
          Select-String -Path $init -Pattern '^APP_VERSION'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build portable exe (one file)
        run: ./build_exe.ps1 -SkipInstall -OneFile -Python python

      - name: Build folder version (faster startup)
        run: ./build_exe.ps1 -SkipInstall -Python python

      - name: Package release files
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/FlickShare.exe release/FlickShare.exe
          Compress-Archive -Path dist/FlickShare -DestinationPath release/FlickShare-windows.zip -Force
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FlickShare-windows
          path: release/*
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(python -c 'import flickshare_app as f; print(f.APP_VERSION)')"
          fi
          echo "Publishing $TAG"

          # Release notes come from RELEASE.md, minus its "# title" line (the release has its own title).
          sed '1{/^# /d}' RELEASE.md > "$RUNNER_TEMP/notes.md"

          # Remove the old rolling pre-release from earlier versions of this workflow.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version pushed again: point the tag at this commit and replace the files.
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --prerelease=false --draft=false --latest
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "FlickShare Desktop $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
